name: SciFi CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest suite
        run: uv run pytest tests/ -v

      - name: Verify CLI commands & doctor
        run: |
          uv run sf --help
          uv run sf doctor --help
          uv run sf sync --dry-run

      - name: Verify package build & AI agent plugin bundle
        run: |
          uv run sf package --output-dir dist_ci
          uv run python -c "import zipfile, glob; zf = zipfile.ZipFile(glob.glob('dist_ci/scifi-plugin-*.zip')[0]); print('Plugin entries:', len(zf.namelist()))"
