[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scifi"
version = "0.1.0"
description = "Scientific Research & Academic Writing Toolkit for literature verification, paper auditing, and proof structuring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.11.0",
    "bibtexparser>=2.1.0",
    "numpy>=2.5.4",
    "pint>=0.26.2",
    "requests>=2.34.2",
    "sympy>=1.14.0",
    "pypdf>=4.0.0",
    "scipy>=1.18.1",
    "mcp>=1.0.0,<2",
    "pytest>=8.0.0",
]

[project.scripts]
scifi = "scifi.cli:main"
scifi-verify = "scifi.citation_verifier.cli:main"
alex = "scifi.citation_verifier.cli:main"
scifi-argus = "scifi.argus.cli:main"
argus = "scifi.argus.cli:main"

