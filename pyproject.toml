[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scifi"
dynamic = ["version"]
description = "Scientific Research & Academic Writing Toolkit for literature verification, paper auditing, mathematical derivations, and LaTeX manuscripts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "SciFi Contributors" }
]
keywords = [
    "scientific-writing",
    "citation-verification",
    "latex",
    "sympy",
    "mcp",
    "model-context-protocol",
    "academic-research",
    "peer-review",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "antlr4-python3-runtime==4.11.0",
    "bibtexparser>=2.1.0",
    "numpy>=2.5.4",
    "pint>=0.26.2",
    "requests>=2.34.2",
    "sympy>=1.14.0",
    "pypdf>=4.0.0",
    "scipy>=1.18.1",
    "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[project.urls]
Homepage = "https://github.com/Betagors/scifi"
Repository = "https://github.com/Betagors/scifi"
Issues = "https://github.com/Betagors/scifi/issues"

[project.scripts]
scifi = "scifi.cli:main"
sf = "scifi.cli:main"
scifi-verify = "scifi.citation_verifier.cli:main"
alex = "scifi.citation_verifier.cli:main"
scifi-argus = "scifi.argus.cli:main"
argus = "scifi.argus.cli:main"

[tool.hatch.version]
path = "scifi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["scifi"]
