<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="scifiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <!-- Central Scientific Core -->
  <circle cx="64" cy="64" r="10" fill="url(#scifiGrad)" />
  <!-- Diagonal Orbit 1 -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#scifiGrad)" stroke-width="4.5" transform="rotate(45 64 64)" stroke-linecap="round" />
  <!-- Diagonal Orbit 2 -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#scifiGrad)" stroke-width="4.5" transform="rotate(-45 64 64)" stroke-linecap="round" />
  <!-- Orbital Node Marker -->
  <circle cx="96" cy="32" r="4.5" fill="#38BDF8" />
</svg>