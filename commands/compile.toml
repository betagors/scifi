description = "Compile LaTeX manuscript and diagnose build errors"
prompt = "Execute the compiler skill on the target .tex file. Run skills/compiler/scripts/compile_latex.py --tex {{args}}. On SUCCESS report the pdf_path and any non-fatal warnings. On FAILED navigate to each errors[].file:line, fix the syntax issue, and recompile. On ENGINE_MISSING execute the install_command from the JSON response. After a clean build, cross-check undefined_citations against the .bib file if present."
