description = "Run SciFi Scientific Research & Academic Writing Toolkit (citations, academic prose, math proofs)"
prompt = "Execute SciFi toolkit actions for academic and scientific papers. Options: 1) Alex: verify citations, check retracted papers, validate DOIs against registries (Crossref, OpenAlex, arXiv, DataCite), or audit .bib files. 2) Human: rewrite AI text into rigorous academic prose without AI-isms, slop, marketing fluff, or em dashes. 3) Turing: verify LaTeX derivations, limits, matrix shapes, units, convexity, or notation consistency. 4) Compiler: compile LaTeX manuscripts and diagnose build errors. 5) Argus: check uncredited methods and auto-cite. Target/Arguments: {{args}}"
