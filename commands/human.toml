description = "Audit and rewrite AI text or LaTeX source code into rigorous, authentic human-authored academic prose"
prompt = "Audit and rewrite the provided text or LaTeX source using the SciFi human academic prose and LaTeX stylometric protocol. Eradicate Kobak et al. excess AI vocabulary (delve, pivotal, intricate, crucial, notably, underscores, showcasing, tapestry, testament), em dashes, and formulaic pre-equation transitions. In LaTeX markup, de-template '\\item \\textbf{...}:' list clones (target CV > 0.40), move conversational '\\text{where }' clauses out of display math into body prose, scope multi-letter subscripts with \\mathrm{...}, define semantic \\newcommand macros, and enforce high sentence-length burstiness (B_length > 0.55), passive constructions, and epistemic hedging. Input text/file: {{args}}"
